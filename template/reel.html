<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>FoodStock Reel</title>
  <style>
    @font-face { font-family: Kanit; src: url("__FONTS__/Kanit-Bold.ttf") format("truetype"); font-weight: 700; }
    @font-face { font-family: NotoThai; src: url("__FONTS__/NotoSansThai.ttf") format("truetype"); font-weight: 600; }
    :root { --slate: #2A333B; --cream: #F5EFE6; --dim: #C7CDD2; --amber: #E0A43B; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--slate); }
    #reel-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--slate); }
    .title-card, .video-wrap, .outro { position: absolute; inset: 0; }
    .title-card { z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 220px 180px 320px; background: var(--slate); text-align: center; }
    .title-logo { width: 210px; height: auto; margin-bottom: 84px; }
    .restaurant { max-width: 900px; margin: 0; color: var(--cream); font-family: Kanit, sans-serif; font-size: 116px; line-height: 1.12; font-weight: 700; }
    .amber-rule { width: 190px; height: 4px; margin: 46px 0 32px; background: var(--amber); transform-origin: center; }
    .location { color: var(--dim); font: 600 40px/1.3 NotoThai, sans-serif; }
    .video-wrap { z-index: 1; opacity: 0; }
    .video-wrap video { width: 100%; height: 100%; display: block; object-fit: cover; }
    .video-logo { position: absolute; top: 240px; left: 48px; width: 150px; height: auto; opacity: .92; filter: drop-shadow(0 3px 8px rgba(0,0,0,.38)); }
    .subtitle { position: absolute; z-index: 2; left: 180px; right: 180px; max-width: 720px; margin: 0 auto; bottom: 360px; min-height: 74px; padding: 12px 30px 16px; border-radius: 18px; color: var(--cream); background: rgba(42,51,59,.78); font: 600 56px/1.25 NotoThai, sans-serif; text-align: center; text-wrap: balance; opacity: 0; }
    .outro { z-index: 6; display: flex; align-items: center; justify-content: center; background: var(--slate); opacity: 0; }
    .outro-logo { width: 250px; height: auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div id="reel-root" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920" data-duration="__TOTAL_DURATION__">
    <div class="video-wrap" data-layout-allow-occlusion="intentional-outro-cover">
      <video id="source-video" class="clip" src="__SOURCE__" muted playsinline data-start="1.2" data-duration="__SOURCE_DURATION__" data-track-index="0" __MEDIA_START__></video>
      <img class="video-logo" src="__LOGO__" alt="FoodStock">
      <div id="subtitle" class="subtitle"></div>
    </div>
    <audio id="source-audio" src="__SOURCE__" data-start="1.2" data-duration="__SOURCE_DURATION__" data-track-index="1" data-volume="1" __MEDIA_START__></audio>
    <section id="title-card" class="title-card clip" data-start="0" data-duration="1.8" data-track-index="3">
      <img class="title-logo" src="__LOGO__" alt="FoodStock">
      <h1 class="restaurant">__RESTAURANT__</h1>
      <div class="amber-rule"></div>
      <div class="location">FoodStock · พัฒนาการ 32</div>
    </section>
    <div id="outro" class="outro clip" data-start="__OUTRO_START__" data-duration="1.2" data-track-index="4" data-layout-allow-occlusion="intentional-fade"><img class="outro-logo" src="__LOGO__" alt="FoodStock"></div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__transcript = __TRANSCRIPT__;
      window.__subtitleCues = __CUES__;
      const tl = gsap.timeline({ paused: true });
      tl.from('.title-logo', { opacity: 0, y: 24, duration: .45, ease: 'sine.out' }, .1)
        .from('.restaurant', { opacity: 0, y: 55, duration: .7, ease: 'power3.out' }, .22)
        .from('.amber-rule', { scaleX: 0, duration: .45, ease: 'power2.out' }, .5)
        .from('.location', { opacity: 0, y: 18, duration: .4, ease: 'sine.out' }, .68)
        .to('.title-card', { opacity: 0, duration: .6, ease: 'power2.out' }, 1.2)
        .to('.video-wrap', { opacity: 1, duration: .6, ease: 'sine.out' }, 1.2)
        .to('.outro', { opacity: 1, duration: .5, ease: 'power2.out' }, __OUTRO_START__);
      const subtitle = document.getElementById('subtitle');
      window.__subtitleCues.forEach((cue) => {
        const enter = 1.2 + cue.start;
        const exit = 1.2 + cue.end;
        tl.call(() => { subtitle.textContent = cue.text; }, [], enter)
          .fromTo(subtitle, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .2, ease: 'sine.out', overwrite: 'auto' }, enter)
          .to(subtitle, { opacity: 0, y: -8, duration: .18, ease: 'sine.out' }, exit);
      });
      window.__timelines['reel'] = tl;
    </script>
  </div>
</body>
</html>
