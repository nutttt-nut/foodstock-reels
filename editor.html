<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReelEdit</title>
<style>
@font-face{font-family:Kanit;src:url('/fonts/Kanit-SemiBold.ttf')}@font-face{font-family:Kanit;src:url('/fonts/Kanit-Bold.ttf');font-weight:700}@font-face{font-family:Noto;src:url('/fonts/NotoSansThai.ttf')}*{box-sizing:border-box}body{margin:0;background:#20282f;color:#f5efe6;font:14px Noto,system-ui,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#495862;border-bottom:2px solid #e0a43b;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font:700 22px Kanit}.brand em{color:#e0a43b;font-style:normal}.eyebrow{font:11px Kanit;letter-spacing:2px;color:#c7cdd2;margin-left:14px}.top-actions{display:flex;gap:10px;align-items:center}.token{width:180px;background:#2a333b;border:1px solid #6d7c85;border-radius:4px;padding:7px 9px;color:#f5efe6;font-size:11px}.btn{border:1px solid #687780;background:#2a333b;color:#f5efe6;border-radius:4px;padding:9px 13px;font:600 13px Kanit}.btn:hover{border-color:#e0a43b}.btn.primary{background:#e0a43b;border-color:#e0a43b;color:#2a333b}.btn:disabled{opacity:.4;cursor:not-allowed}.shell{display:grid;grid-template-columns:275px 1fr;min-height:calc(100vh - 64px);height:calc(100vh - 64px)}aside{background:#171f26;border-right:1px solid #35434c;display:flex;flex-direction:column}.side-head{padding:18px 16px 12px;display:flex;justify-content:space-between;align-items:end}.side-head h2{margin:0;font:700 20px Kanit}.count{font:11px Kanit;color:#8d9aa1}.clip-list{overflow:auto;flex:1;padding:0 10px}.clip{padding:13px 10px;border:1px solid transparent;border-bottom-color:#2a343b;display:flex;gap:10px;align-items:start;cursor:pointer}.clip:hover{background:#222d35}.clip.active{border-color:#e0a43b;background:#2a333b;border-radius:4px}.clip-dot{width:8px;height:8px;border-radius:50%;background:#67757d;margin-top:6px;flex:0 0 auto}.clip-dot.TRANSCRIBED{background:#e0a43b}.clip-dot.READY{background:#61a9d5}.clip-dot.RENDERED{background:#69bc84}.clip-name{font:600 14px Kanit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clip-status{font:10px Kanit;letter-spacing:1px;color:#9ba7ad;margin-top:3px}.clip-status.TRANSCRIBED{color:#e0a43b}.clip-status.READY{color:#79c5ed}.clip-status.RENDERED{color:#78d38f}.add{margin:12px;background:#2a333b;border:1px dashed #6d7c85;color:#e0a43b;padding:12px;border-radius:4px;font:600 13px Kanit}.main{display:grid;grid-template-columns:minmax(460px,1fr) 460px;min-width:0}.preview{background:#12191e;display:flex;align-items:center;justify-content:center;padding:30px;position:relative}.preview video{height:min(76vh,760px);max-width:100%;aspect-ratio:9/16;background:#0c1114;box-shadow:0 16px 50px #0009;border:1px solid #53616a}.preview-note{position:absolute;left:24px;top:20px;color:#677780;font:11px Kanit;letter-spacing:1px}.panel{background:#2a333b;border-left:1px solid #3b4850;padding:24px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #46545c;padding-bottom:16px;margin-bottom:18px}.panel h1{font:700 25px Kanit;margin:0}.muted{color:#9eabb0;font-size:11px}.badge{font:11px Kanit;letter-spacing:1px;padding:5px 8px;border-radius:3px;background:#4d5960;color:#d8e0e2}.badge.TRANSCRIBED{background:#604d29;color:#ffd477}.badge.READY{background:#214d66;color:#a8ddff}.badge.RENDERED{background:#23533a;color:#adf2c2}.section{margin:22px 0}.section-title{font:11px Kanit;letter-spacing:2px;color:#c7cdd2;text-transform:uppercase;margin-bottom:10px}.cue{display:grid;grid-template-columns:57px 57px 1fr 28px;gap:6px;margin:8px 0;align-items:start}.cue input,.cue textarea,.restaurant{background:#20282f;border:1px solid #45535b;border-radius:3px;color:#f5efe6;padding:7px;font-size:12px}.cue textarea{min-height:54px;resize:vertical;line-height:1.5}.cue input:focus,.cue textarea:focus,.restaurant:focus{outline:none;border-color:#e0a43b}.cue button{background:transparent;border:1px solid #633b3b;color:#e9857c;border-radius:3px;height:28px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-left:3px solid #e0a43b;background:#222d35;color:#c7cdd2;font-size:12px;line-height:1.6}.notice strong{color:#f5efe6}.jobs{font:11px ui-monospace,monospace;color:#a8b4b9;background:#171f26;padding:10px;border-radius:4px;white-space:pre-wrap;max-height:110px;overflow:auto}.empty{margin:auto;text-align:center;color:#7d8a91}.upload{position:fixed;inset:0;background:#10161acc;display:none;align-items:center;justify-content:center}.dialog{width:390px;background:#2a333b;border:1px solid #65747d;border-top:3px solid #e0a43b;border-radius:5px;padding:24px;box-shadow:0 20px 60px #000b}.dialog h2{font:700 22px Kanit;margin:0 0 18px}.dialog label{display:block;color:#c7cdd2;font:11px Kanit;letter-spacing:1px;margin:12px 0 5px}.dialog input[type=text],.dialog input[type=file]{width:100%;padding:9px;background:#20282f;border:1px solid #45535b;color:#f5efe6;border-radius:3px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:900px){.main{grid-template-columns:1fr}.panel{display:none}.shell{grid-template-columns:230px 1fr}}
.preview-frame{height:min(76vh,760px);max-width:100%;aspect-ratio:9/16;position:relative;background:#0c1114;box-shadow:0 16px 50px #0009;border:1px solid #53616a;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover}.preview-logo{position:absolute;top:12.5%;left:4.45%;width:13.9%;filter:drop-shadow(0 3px 8px #0008);pointer-events:none}.preview-subtitle{position:absolute;left:16.7%;right:16.7%;bottom:18.75%;padding:8px 12px;border-radius:9px;background:#2a333bcc;color:#f5efe6;text-align:center;font:600 clamp(12px,3vw,25px)/1.25 Noto,sans-serif;text-wrap:balance;display:none;pointer-events:none}.safe-guide{position:absolute;inset:11.5% 16.7% 16.7% 0;border:1px dashed #e0a43b99;pointer-events:none;display:none}.safe-guide.on{display:block}/* Project wizard; legacy selectors remain unchanged. */
#project-view{padding:20px 3vw 100px!important}#project-view button:focus-visible{outline:2px solid #e0a43b;outline-offset:3px}.wizard-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stepper{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stepper button{border:0;background:transparent;color:#9eabb0;padding:5px}.stepper i{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid #687780;border-radius:50%;font-style:normal;margin-right:5px}.stepper .done i{background:#315a46;color:#adf2c2}.stepper .current{color:#e0a43b}.stepper .current i{border-color:#e0a43b;background:#604d29}.wizard-content{max-width:880px;margin:30px auto}.wizard-content h2{font:700 25px Kanit}.wizard-input{width:100%;padding:10px;color:#f5efe6;background:#20282f;border:1px solid #687780;border-radius:4px;font:inherit}.wizard-label{display:block;margin:14px 0 6px}.wizard-footer{position:fixed;bottom:0;left:0;right:0;background:#171f26;border-top:1px solid #45535b;padding:14px 3vw;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:4}.dropzone{border:1px dashed #e0a43b;padding:35px;text-align:center;border-radius:6px;cursor:pointer;margin-bottom:22px}.dropzone.drag{background:#604d29}.source-grid,.pattern-grid,.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.source-card,.pattern-card,.summary-tile{padding:12px;border:1px solid #45535b;border-radius:5px;background:#2a333b;min-width:0;overflow-wrap:anywhere}.source-card img{width:100%;aspect-ratio:9/16;object-fit:cover}.pattern-card{text-align:left;color:inherit;cursor:pointer}.pattern-card.selected,.chip.selected{border-color:#e0a43b;background:#604d2944}.pattern-strip,.timeline{display:flex;gap:2px;overflow:hidden;margin:14px 0}.pattern-strip{height:9px}.pattern-strip span,.timeline button{background:#495862}.pattern-strip span:nth-child(even),.timeline button:nth-child(even){background:#687780}.pattern-strip .accent,.timeline button.accent{background:#e0a43b;color:#20282f}.timeline button{min-width:0;color:#f5efe6;padding:9px 0;border:0;position:relative;overflow:hidden}.timeline button.active{outline:2px solid #f5efe6;outline-offset:-2px}.timeline button .playhead{position:absolute;top:0;bottom:0;left:0;background:#ffffff44;pointer-events:none}.preview-top{margin:18px 0}.preview-top h2{margin:8px 0}.over{color:#e9857c}.cut-layout{display:grid;grid-template-columns:250px 340px minmax(210px,1fr);gap:20px;align-items:start}.shot-list{max-height:68vh;overflow:auto}.shot-row{display:grid;grid-template-columns:24px 43px 1fr;gap:8px;padding:10px 7px;border-left:3px solid transparent;background:#171f26;cursor:pointer;margin:3px 0;min-width:0}.shot-row.active{border-left-color:#e0a43b;background:#2a333b}.shot-row.invalid{outline:1px solid #e9857c}.shot-row img{width:43px;aspect-ratio:9/16;object-fit:cover}.shot-row strong{color:#e0a43b}.shot-row .shot-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot-editor{padding:18px;background:#2a333b;min-width:0}.shot-editor h3{margin-top:0;font:600 16px Kanit}.shot-editor .row>*{flex:1;min-width:0}.brand-box{border-top:1px solid #45535b;margin-top:25px;padding-top:20px}.logo-mini{width:48px;height:48px;object-fit:contain;background:#495862}.corner-picker{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0;max-width:130px}.cut-preview{display:flex;align-items:center;flex-direction:column;gap:12px}.cut-screen{position:relative;width:min(100%,360px);aspect-ratio:9/16;background:#0c1114;overflow:hidden}.cut-screen video{position:absolute;width:100%;height:100%;object-fit:cover}.cut-screen .safe-guide{display:block;inset:11.4583% 16.6667% 16.6667% 0}.cut-screen .preview-logo{height:auto;max-height:45%;object-fit:contain}.cut-screen .preview-subtitle{font-size:clamp(13px,1.6vw,21px)}.timecode{position:absolute;bottom:5%;left:5%;padding:4px 7px;background:#0009;font:11px monospace}.cut-flash{position:absolute;inset:0;background:white;pointer-events:none;opacity:0}.export-json{padding:15px;background:#171f26;white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto}.summary-tile strong{display:block;font:700 22px Kanit}.wizard-error{color:#e9857c;overflow-wrap:anywhere}.export-item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #45535b}.project-global-note{margin:12px 0}.wizard-loading{color:#e0a43b}#project-view a{color:#e0a43b}@media(max-width:1100px){.cut-layout{grid-template-columns:210px 290px minmax(180px,1fr);gap:12px}}@media(max-width:899px){.cut-layout{grid-template-columns:minmax(0,1fr)}.shot-list{order:1;max-height:280px}.cut-preview{order:2}.shot-editor{order:3}.wizard-head{align-items:flex-start}.stepper{gap:3px}.stepper button{font-size:11px}.stepper i{width:22px;height:22px;margin-right:2px}.top{padding:8px;height:auto;min-height:64px;gap:8px;flex-wrap:wrap}.top .eyebrow{display:none}.top-actions{flex-wrap:wrap}.token{width:140px}.wizard-content{margin:20px auto}.summary-grid{grid-template-columns:1fr 1fr}.cut-screen .preview-subtitle{font-size:20px}#project-view{max-width:100vw}.wizard-footer{font-size:11px}}
</style></head><body>
<header class="top"><div><span class="brand">Food<em>Stock</em></span><span class="eyebrow">REELS / EDIT DESK</span><span class="eyebrow" id="storage">storage: …</span></div><div class="top-actions"><input class="token" id="token" placeholder="editor token (optional)" type="password"><button class="btn" onclick="refreshView()">Refresh</button><button class="btn" id="legacy-link" onclick="showLegacy()">Legacy clips</button><span class="muted" id="import-notice" style="display:none" title="ต้องตั้ง rclone remote gdrive ก่อน (ดู #121)">ต้องตั้ง rclone remote gdrive ก่อน (ดู #121)</span><button class="btn" id="import-button" onclick="openImport()">＋ Import จาก Drive link</button><button class="btn primary" id="legacy-upload" onclick="openUpload()" style="display:none">+ เพิ่มคลิป</button></div></header>
<section id="projects-home" style="height:calc(100vh - 64px);overflow:auto;padding:28px 5vw"><div class="row" style="justify-content:space-between;align-items:center"><div><h1 style="font:700 28px Kanit;margin:0">Projects</h1><div class="muted">สร้างโปรเจกต์และจัดการ source videos</div></div><button class="btn primary" onclick="newProject()">+ New project</button></div><div id="project-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:24px"></div><div style="margin-top:24px"><button class="btn" onclick="showLegacy()">Legacy clips →</button></div></section>
<section id="project-view" style="display:none;height:calc(100vh - 64px);overflow:auto;padding:20px 4vw"></section>
<div class="upload" id="project-create"><form class="dialog" onsubmit="createProject(event)"><h2>New project</h2><label>ชื่อโปรเจกต์</label><input id="project-name" type="text" required><div class="dialog-actions"><button type="button" class="btn" onclick="closeProjectCreate()">ยกเลิก</button><button class="btn primary">สร้างโปรเจกต์</button></div></form></div>
<div id="legacy-view" style="display:none">
<div class="shell"><aside><div class="side-head"><h2>Clip queue</h2><span class="count" id="count">—</span></div><div class="clip-list" id="clip-list"></div><button class="add" onclick="openUpload()">+ เพิ่ม source video</button></aside><main class="main"><section class="preview"><span class="preview-note">SOURCE PREVIEW · 9:16</span><div class="preview-frame"><video id="source" controls playsinline></video><img class="preview-logo" src="/brand/logo-cream.png"><div class="preview-subtitle" id="preview-subtitle"></div><div class="safe-guide" id="safe-guide"></div></div><div class="empty" id="empty">เลือกคลิปจาก queue<br><small>preview โดยประมาณ — ผลจริงดูหลัง render</small></div></section><section class="panel" id="panel"><div class="empty">เลือกคลิปเพื่อเริ่มงาน</div></section></main></div>
<div class="upload" id="upload"><form class="dialog" onsubmit="upload(event)"><h2>เพิ่มคลิปใหม่</h2><label>ชื่อร้าน</label><input id="restaurant" type="text" required placeholder="เช่น ครัวบ้านสวน"><label>ชื่อโฟลเดอร์ (optional)</label><input id="clip-name" type="text" placeholder="sample-foodstock"><label>source.mp4</label><input id="file" type="file" accept="video/mp4" required><div class="dialog-actions"><button type="button" class="btn" onclick="closeUpload()">ยกเลิก</button><button class="btn primary">อัปโหลดเข้า Drive</button></div></form></div>
<div class="upload" id="importer"><form class="dialog" onsubmit="scanImport(event)"><h2>Import จาก Drive link</h2><label>Google Drive folder link</label><input id="drive-url" type="text" required placeholder="https://drive.google.com/drive/folders/…"><div id="import-files"></div><label>ชื่อร้าน</label><input id="import-restaurant" type="text" required placeholder="เช่น ครัวบ้านสวน"><label>ชื่อโฟลเดอร์ (optional)</label><input id="import-name" type="text" placeholder="ตั้งจากชื่อร้านอัตโนมัติ"><div class="dialog-actions"><button type="button" class="btn" onclick="closeImport()">ยกเลิก</button><button class="btn primary" id="scan-button">สแกนไฟล์</button></div></form></div>
</div>
<script>
let clips=[], selected=null, transcript=null, poll=null, selectionId=0, inLegacy=false, driveImportAvailable=false;
const $=id=>document.getElementById(id); const auth=()=>{const t=$('token').value.trim();localStorage.setItem('reels-token',t);return t?{'X-Editor-Token':t}:{} }; $('token').value=localStorage.getItem('reels-token')||'';
async function api(path,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(path,opt);const data=await r.json().catch(()=>({}));if(r.status===401)throw Error('ต้องกรอก editor token ในช่องด้านบนก่อน');if(!r.ok)throw Error(data.error||r.statusText);return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadClips(){$('count').textContent='กำลังโหลดจาก Drive…';$('clip-list').innerHTML='<div class="muted" style="padding:14px">กำลังโหลดจาก Drive…</div>';try{const d=await api('/api/clips');clips=d.clips;$('count').textContent=clips.length+' clips';renderList();if(selected){const keep=clips.find(x=>x.name===selected.name);if(keep)select(keep);}}catch(e){$('count').textContent='โหลดไม่สำเร็จ';toast(e.message,true)}}
async function loadConfig(){try{const c=await api('/api/config');driveImportAvailable=c.drive_import;$('storage').textContent='storage: '+c.remote;$('import-button').disabled=!c.drive_import;$('import-notice').style.display=inLegacy&&!c.drive_import?'inline':'none';$('import-button').title=c.drive_import?'':'ต้องตั้ง rclone remote gdrive ก่อน (ดู #121)'}catch(e){$('storage').textContent='storage: ไม่ทราบ'}}
function renderList(){$('clip-list').innerHTML=clips.map(c=>`<div class="clip ${selected&&selected.name===c.name?'active':''}" onclick="selectByName('${esc(c.name)}')"><i class="clip-dot ${c.status}"></i><div><div class="clip-name">${esc(c.restaurant)}</div><div class="clip-status ${c.status}">${c.status==='TRANSCRIBED'?'รอ review':c.status}</div></div></div>`).join('')||'<div class="empty" style="padding:28px 10px">ยังไม่มีคลิป</div>'}
function selectByName(n){select(clips.find(c=>c.name===n))}; async function select(c){if(!c)return;selected=c;transcript=null;const name=c.name, requestId=++selectionId;renderList();$('empty').style.display='none';$('source').style.display='block';$('source').src='/api/clips/'+encodeURIComponent(c.name)+'/source';renderPanel();if(c.files.includes('transcript.json')){try{const data=await api('/api/clips/'+encodeURIComponent(c.name)+'/transcript');if(requestId!==selectionId)return;transcript=data;renderPanel()}catch(e){}}}
function renderPanel(){if(!selected)return;const c=selected;let cues=(transcript?.segments||transcript?.words||[]);$('panel').innerHTML=`<div class="panel-head"><div><h1>${esc(c.restaurant)}</h1><div class="muted">${esc(c.name)} · ${c.files.join(' · ')}</div></div><span class="badge ${c.status}">${c.status}</span></div>${c.status==='NEW'?'<div class="notice"><strong>ยังไม่มี transcript</strong><br>กดถอดเสียงเพื่อเริ่ม review</div>':''}${c.status==='TRANSCRIBED'?'<div class="notice"><strong>Review gate</strong><br>แก้ข้อความและเวลาให้ถูกต้อง แล้วกด “✓ Review เสร็จ” ก่อน render</div>':''}<div class="section"><div class="section-title">Transcript cues</div><div id="cues">${cues.length?cues.map((x,i)=>`<div class="cue"><input data-i="${i}" data-k="start" value="${x.start??0}"><input data-i="${i}" data-k="end" value="${x.end??0}"><textarea data-i="${i}" data-k="text">${esc(x.text||x.word||'')}</textarea><button onclick="removeCue(${i})">×</button></div>`).join(''):'<div class="muted">ยังไม่มี transcript</div>'}</div><div class="row"><button class="btn" onclick="addCue()">+ เพิ่ม cue</button><button class="btn" onclick="saveTranscript()" ${cues.length?'':'disabled'}>บันทึก transcript</button></div></div><div class="section"><div class="section-title">Next action</div><div class="row">${c.status==='NEW'?'<button class="btn primary" onclick="transcribe()">ถอดเสียง</button>':''}${c.status==='TRANSCRIBED'?'<button class="btn primary" onclick="review()">✓ Review เสร็จ</button>':''}${c.status==='READY'?'<button class="btn primary" onclick="renderClip()">Render reel</button>':''}${c.status==='RENDERED'?'<button class="btn primary" onclick="showOutput()">ดู reel</button>':''}</div></div><div id="job"></div>`}
function cueData(){return (transcript?.segments||transcript?.words||[])}function addCue(){const a=cueData();a.push({start:a.length?(+a[a.length-1].end+.1).toFixed(2):0,end:a.length?(+a[a.length-1].end+2).toFixed(2):2,text:''});renderPanel()}function removeCue(i){cueData().splice(i,1);renderPanel()}
function readCues(){document.querySelectorAll('.cue [data-i]').forEach(el=>{const x=cueData()[+el.dataset.i];x[el.dataset.k]=el.dataset.k==='text'?el.value:Number(el.value)})}
async function saveTranscript(){readCues();try{await api('/api/clips/'+selected.name+'/transcript',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(transcript)});toast('บันทึก transcript แล้ว');await loadClips()}catch(e){toast(e.message,true)}}
async function transcribe(){try{const d=await api('/api/clips/'+selected.name+'/transcribe',{method:'POST'});watch(d.job_id)}catch(e){toast(e.message,true)}}async function review(){await saveTranscript();try{await api('/api/clips/'+selected.name+'/review',{method:'POST'});toast('Review gate เปิดแล้ว');await loadClips()}catch(e){toast(e.message,true)}}async function renderClip(){try{const d=await api('/api/clips/'+selected.name+'/render',{method:'POST'});watch(d.job_id)}catch(e){toast(e.message,true)}}
function watch(id){$('panel').insertAdjacentHTML('beforeend','<div class="section" id="watch"><div class="section-title">Job progress</div><div class="jobs" id="joblog">เริ่มงาน…</div></div>');clearInterval(poll);poll=setInterval(async()=>{try{const j=await api('/api/status/'+id);$('joblog').textContent=`${j.status} ${j.progress}%\n`+(j.log||[]).join('\n');if(j.status==='done'||j.status==='error'){clearInterval(poll);await loadClips()}}catch(e){clearInterval(poll)}},700)}async function showOutput(){window.open('/api/clips/'+selected.name+'/output','_blank')}
function openUpload(){$('upload').style.display='flex'}function closeUpload(){$('upload').style.display='none'}
function openImport(){$('importer').style.display='flex'}function closeImport(){$('importer').style.display='none';$('import-files').innerHTML=''}

async function upload(e){e.preventDefault();const f=new FormData();f.append('restaurant',$('restaurant').value);f.append('name',$('clip-name').value);f.append('file',$('file').files[0]);try{await api('/api/clips',{method:'POST',body:f});closeUpload();e.target.reset();toast('อัปโหลดเข้า Drive แล้ว');loadClips()}catch(x){toast(x.message,true)}}function toast(msg,error=false){const el=document.createElement('div');el.textContent=msg;el.style='position:fixed;right:22px;bottom:22px;background:'+(error?'#7b3f3d':'#315a46')+';color:#f5efe6;padding:12px 16px;border-radius:4px;z-index:9;font:13px Noto';document.body.append(el);setTimeout(()=>el.remove(),3500)}

function renderTrim(){const c=selected;if(!c)return;const duration=Number(c.source_duration||$('source').duration||0);const start=Number(c.trim_start||0);const end=Number(c.trim_end||duration);const box=document.createElement('div');box.className='section';box.innerHTML=`<div class="section-title">Trim · max 30s</div><div class="notice">ช่วงที่เลือก: <strong>${start.toFixed(1)}s → ${end.toFixed(1)}s</strong> · ${(end-start).toFixed(1)}s</div><div class="row" style="margin-top:8px"><button class="btn" onclick="setTrimIn()">จุดเริ่ม</button><button class="btn" onclick="setTrimOut()">จุดจบ</button><button class="btn primary" onclick="saveSettings()">บันทึกช่วง</button></div><div class="muted" style="margin-top:6px">source ${duration.toFixed(1)}s · กดจุดเริ่ม/จุดจบจากตำแหน่ง player ปัจจุบัน</div>`;$('panel').prepend(box)}

let project=null, projectSlug=null, projectDirty=false, draftTimer=null, projectConflict=false, pendingDraft=null;

function markDirty(){projectDirty=true;mutation++;clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,2000);renderProjectHeader();updateFooter()}
function saveDraft(){if(!project||!projectSlug||!projectDirty)return;const d={rev:project.rev};draftFields.forEach(k=>d[k]=project[k]);if(project.logo)d.logo={position:project.logo.position,size_pct:project.logo.size_pct};try{localStorage.setItem('project-draft:'+projectSlug,JSON.stringify(d))}catch(e){toast('เก็บฉบับร่างในเครื่องไม่ได้: '+e.message,true)}}

async function loadProjects(){if(busy||saving)return toast('รอการทำงานปัจจุบันเสร็จก่อน',true);stopPlayback();saveDraft();try{const d=await api('/api/projects');projectCards=d.projects;$('project-cards').innerHTML=projectCards.map(p=>`<article class="source-card"><div style="height:140px;background:#171f26;display:grid;place-items:center">${p.thumb?`<img src="${esc(p.thumb)}" style="width:100%;height:140px;object-fit:cover">`:'<span class="muted">No source</span>'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.goal_type||'ยังไม่เลือกเป้าหมาย')} · step ${p.step||1}/5</div><div class="muted">${p.sources} sources · ${p.scenes} shots</div><div class="row" style="margin-top:12px"><button class="btn primary" data-open="${esc(p.slug)}">Open</button><button class="btn" data-delete="${esc(p.slug)}">Delete</button></div></article>`).join('')||'<div class="muted">ยังไม่มีโปรเจกต์</div>';$('project-cards').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProject(b.dataset.open));$('project-cards').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.delete));showHome()}catch(e){toast(e.message,true)}}
function showHome(){inLegacy=false;projectDirty=false;document.querySelector('.brand').innerHTML='Reel<em>Edit</em>';$('projects-home').style.display='block';$('project-view').style.display='none';$('legacy-view').style.display='none';$('legacy-link').textContent='Legacy clips';$('legacy-link').onclick=showLegacy;$('legacy-upload').style.display='none';$('import-button').style.display='none';$('import-notice').style.display='none';window.onbeforeunload=null}

async function createProject(e){e.preventDefault();try{const d=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('project-name').value,target_seconds:30})});closeProjectCreate();e.target.reset();await openProject(d.slug)}catch(x){toast(x.message,true)}}
async function deleteProject(slug){if(!confirm('ย้าย '+(projectCards.find(p=>p.slug===slug)?.name||slug)+' ไปถังขยะ?'))return;try{await api('/api/projects/'+encodeURIComponent(slug),{method:'DELETE'});localStorage.removeItem('project-draft:'+slug);await loadProjects()}catch(e){toast(e.message,true)}}
async function openProject(slug){if(busy||saving)return toast('รอการทำงานปัจจุบันเสร็จก่อน',true);stopPlayback();clearTimeout(draftTimer);try{const [p,c]=await Promise.all([api('/api/projects/'+encodeURIComponent(slug)),api('/api/patterns')]);project={goal_type:null,pattern:null,logo:null,step:1,...p};projectSlug=slug;patternConfig=c;projectDirty=false;projectConflict=false;pendingDraft=null;mutation=0;wizardStep=project.step;shotIndex=0;showProject();const raw=localStorage.getItem('project-draft:'+slug);if(raw){try{const d=JSON.parse(raw);showDraftOffer(d,d.rev!==project.rev)}catch(e){toast('อ่านฉบับร่างไม่ได้',true)}}}catch(e){toast(e.message,true)}}
function showDraftOffer(d,conflict){pendingDraft=d;projectConflict=conflict;$('draft-offer').innerHTML=`<div class="notice">${conflict?'ฉบับร่างอิง rev เก่า — ใช้ฉบับร่างจะนำการแก้ไขมาทับข้อมูลปัจจุบัน':'พบฉบับร่างที่ยังไม่บันทึก'}<div class="row"><button class="btn" onclick="dismissDraft()">โหลดใหม่</button><button class="btn primary" onclick="restorePendingDraft()">ใช้ฉบับร่าง</button></div></div>`}

function restorePendingDraft(){if(projectConflict&&!confirm('ใช้การแก้ไขจากฉบับร่างกับ rev ปัจจุบัน?'))return;const d=pendingDraft||{};draftFields.forEach(k=>{if(k in d)project[k]=d[k]});if(project.logo&&d.logo)Object.assign(project.logo,d.logo);projectConflict=false;pendingDraft=null;wizardStep=project.step||1;markDirty();showProject()}
function stepComplete(n){return n===1?project.sources.length>0:n===2?!!project.goal_type:n===3?!!project.pattern:n===4?project.scenes.length>0:true}
function updateFooter(){const el=$('wizard-next');if(el)el.disabled=busy||!stepComplete(wizardStep);const info=$('wizard-status');if(info)info.textContent=wizardStep<4?`${project.sources.length} sources`:`${project.scenes.length} shots · ${seconds().toFixed(1)}s`}
async function nextStep(){if(busy||!stepComplete(wizardStep)||wizardStep===5)return;const next=wizardStep+1,old=project.step;project.step=Math.max(project.step,next);markDirty();if(!await saveProject()){project.step=old;markDirty();return}wizardStep=next;showProject();if(next===4&&!project.scenes.length)await autoCut(false)}
function goStep(n){if(busy||saving||n>project.step)return;stopPlayback();wizardStep=n;showProject()}
function showProject(){clearTimeout(frameTimer);stopPlayback();if(!project)return;inLegacy=false;document.querySelector('.brand').innerHTML='Reel<em>Edit</em>';$('projects-home').style.display='none';$('legacy-view').style.display='none';$('project-view').style.display='block';$('legacy-link').textContent='← Projects';$('legacy-link').onclick=leaveProject;$('legacy-upload').style.display='none';$('import-button').style.display='none';$('import-notice').style.display='none';$('project-view').innerHTML=`<div class="wizard-head"><div><button class="btn" onclick="leaveProject()">← Projects</button> <strong>${esc(project.name)}</strong></div><div class="row"><span id="project-save-state" class="muted"></span><button class="btn primary" onclick="saveProject()">Save</button></div></div><nav class="stepper" aria-label="ขั้นตอน">${['Sources','เป้าหมาย','Pattern','Preview','Export'].map((s,i)=>`<button class="${wizardStep===i+1?'current':project.step>i+1?'done':''}" ${i+1>project.step?'disabled':''} onclick="goStep(${i+1})"><i>${project.step>i+1&&wizardStep!==i+1?'✓':i+1}</i>${s}</button>`).join('')}</nav><div id="draft-offer"></div><div id="wizard-body"></div><footer class="wizard-footer"><button class="btn" ${wizardStep===1?'disabled':''} onclick="goStep(${wizardStep-1})">← ย้อนกลับ</button><span id="wizard-status"></span>${wizardStep<5?'<button id="wizard-next" class="btn primary" onclick="nextStep()">ถัดไป →</button>':'<span>Export to agent</span>'}</footer>`;[null,renderSources,renderGoal,renderPatterns,renderCut,renderExport][wizardStep]();renderProjectHeader();updateFooter();if(pendingDraft)showDraftOffer(pendingDraft,projectConflict)}
function renderSources(){$('wizard-body').innerHTML=`<div class="wizard-content"><h2>Sources</h2><div class="dropzone" id="source-drop" role="button" tabindex="0">+ ลากไฟล์มาวาง หรือคลิกเพื่อเลือก<input hidden id="source-files" type="file" accept=".mp4,.mov,video/mp4,video/quicktime" multiple></div><div id="source-progress" class="muted"></div><div class="source-grid">${project.sources.map(s=>`<article class="source-card"><img src="${sourceURL(s.id)}/frame?t=0" alt="${esc(s.original_name)}"><div>${esc(s.original_name)}</div><div class="muted">${Number(s.duration).toFixed(1)}s</div><button class="btn" data-source-delete="${esc(s.id)}">Delete</button></article>`).join('')}</div></div>`;const zone=$('source-drop'),input=$('source-files');zone.onclick=e=>{if(e.target!==input)input.click()};zone.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};input.onchange=()=>addSources(input.files);zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag')};zone.ondragleave=()=>zone.classList.remove('drag');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');addSources(e.dataTransfer.files)};$('wizard-body').querySelectorAll('[data-source-delete]').forEach(b=>b.onclick=()=>deleteSource(b.dataset.sourceDelete))}
async function addSources(files){if(busy||saving||!files.length)return;busy=true;updateFooter();const f=new FormData();for(const file of files)f.append('files',file);if($('source-progress'))$('source-progress').textContent='กำลังอัปโหลด…';try{const d=await api(projectPath()+'/sources',{method:'POST',body:f});project.sources=d.sources;project.rev=d.rev;saveDraft();renderSources();renderProjectHeader()}catch(e){toast(e.message,true)}finally{busy=false;updateFooter();if($('source-progress'))$('source-progress').textContent=''}}
async function deleteSource(id){if(busy||saving||!confirm('ย้าย source ไปถังขยะ?'))return;if(project.scenes.some(s=>s.source===id))return toast('source นี้ถูกใช้ใน shot กรุณาลบ shot และ Save ก่อน',true);busy=true;try{const d=await api(sourceURL(id),{method:'DELETE'});project.sources=d.sources;project.rev=d.rev;saveDraft();renderSources();renderProjectHeader()}catch(e){toast(e.message,true)}finally{busy=false;updateFooter()}}
function renderGoal(){$('wizard-body').innerHTML=`<div class="wizard-content"><h2>เป้าหมาย</h2><label class="wizard-label" for="project-prompt">อยากให้คลิปนี้ทำอะไร</label><textarea class="wizard-input" id="project-prompt" rows="5">${esc(project.prompt)}</textarea><label class="wizard-label">ประเภทเป้าหมาย</label><div class="row">${patternConfig.goal_types.map((g,i)=>`<button class="btn chip ${project.goal_type===g?'selected':''}" data-goal="${i}">${esc(g)}</button>`).join('')}</div><label class="wizard-label" for="target-seconds">ความยาวเป้าหมาย (วินาที)</label><input class="wizard-input" id="target-seconds" type="number" min="0.1" step="0.1" value="${project.target_seconds}"><p class="muted">IG Reels · 1080×1920</p></div>`;$('project-prompt').oninput=e=>{project.prompt=e.target.value;markDirty()};$('target-seconds').oninput=e=>{project.target_seconds=Number(e.target.value);markDirty()};$('wizard-body').querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{project.goal_type=patternConfig.goal_types[+b.dataset.goal];markDirty();renderGoal()})}
function renderPatterns(){$('wizard-body').innerHTML=`<div class="wizard-content"><h2>Pattern</h2><p class="muted">รายการ pattern มาจาก playbook</p><div class="pattern-grid">${patternConfig.patterns.map((p,i)=>`<button class="pattern-card ${project.pattern?.id===p.id?'selected':''}" data-pattern="${i}"><strong>${esc(p.name)}</strong> ${p.sample?'<span class="badge">ตัวอย่าง</span>':''}<p>${p.shots.length} shots · ${p.shots.reduce((n,s)=>n+s.seconds,0).toFixed(1)}s</p><div>${esc(p.description||'')}</div><div class="pattern-strip">${p.shots.map(s=>`<span style="flex:${s.seconds}" class="${['hook','cta'].includes(s.role)?'accent':''}"></span>`).join('')}</div></button>`).join('')}</div>${patternConfig.errors.length?'<div class="wizard-error"><p>ไฟล์ pattern ที่อ่านไม่ได้</p>'+patternConfig.errors.map(e=>`<p>${esc(e.file)}: ${esc(e.error)}</p>`).join('')+'</div>':''}</div>`;$('wizard-body').querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>pickPattern(+b.dataset.pattern))}
async function pickPattern(i){if(busy||saving)return;const p=patternConfig.patterns[i];if(project.pattern?.id===p.id)return;if(project.scenes.length&&!confirm('ตัดใหม่ตาม pattern นี้?'))return;project.pattern=JSON.parse(JSON.stringify(p));markDirty();renderPatterns();if(project.scenes.length)await autoCut(false)}
async function autoCut(ask=true){if(busy||saving)return;if(ask&&projectDirty&&!confirm('มีการแก้ไขที่ยังไม่บันทึก — ตัดใหม่? shot ที่ล็อกจะคงเดิม'))return;stopPlayback();busy=true;updateFooter();const oldMutation=mutation;try{const d=await api(projectPath()+'/autocut',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pattern:project.pattern,scenes:project.scenes})});if(mutation!==oldMutation&&!confirm('มีการแก้ไขระหว่างตัดใหม่ ใช้ผลการตัดใหม่หรือไม่?'))return;project.scenes=d.scenes;shotIndex=0;markDirty();if(wizardStep===4)renderCut();if(d.skipped_sources?.length)toast('บาง source วิเคราะห์ cut ไม่สำเร็จ: '+d.skipped_sources.map(s=>typeof s==='string'?s:s.id||s.source).join(', '),true)}catch(e){toast(e.message,true)}finally{busy=false;updateFooter()}}
function renderCut(){$('wizard-body').innerHTML=`<div class="preview-top"><h2>${esc(project.prompt||'Preview')}</h2><div class="muted">${esc(project.goal_type||'')} · ${esc(project.pattern?.name||'')} · ${project.sources.length} sources</div><div id="total-time"></div><div id="timeline" class="timeline"></div><div class="row"><button class="btn" onclick="autoCut()">↻ ตัดใหม่</button><button class="btn primary" onclick="saveProject()">Save</button></div></div><div class="cut-layout"><div class="shot-list"><div class="section-title">SHOTS</div><div id="shots"></div></div><div id="shot-editor" class="shot-editor"></div><div class="cut-preview"><div class="cut-screen"><video id="cut-a" preload="auto" playsinline></video><video id="cut-b" preload="auto" playsinline style="visibility:hidden"></video><div class="safe-guide"></div><img id="cut-logo" class="preview-logo" alt="brand logo"><div id="cut-subtitle" class="preview-subtitle"></div><div id="cut-timecode" class="timecode"></div><div id="cut-flash" class="cut-flash"></div></div><div class="row"><button class="btn" onclick="playShots(false)">▶ shot นี้</button><button class="btn primary" onclick="playShots(true)">▶ ทั้งคลิป</button><button class="btn" onclick="stopPlayback()">หยุด</button></div><div class="muted" id="playback-state" aria-live="polite"></div></div></div>`;shotIndex=Math.min(shotIndex,Math.max(0,project.scenes.length-1));renderShotList();renderShotEditor();updateOverlays();if(project.scenes.length)selectShot(shotIndex)}
function renderShotList(){if(!$('shots'))return;const total=seconds(),remaining=project.target_seconds-total;$('total-time').innerHTML=`<p class="${remaining<0?'over':''}">${total.toFixed(1)}s / ${project.target_seconds}s · ${remaining<0?'เกิน '+(-remaining).toFixed(1)+' s':'เหลือ '+remaining.toFixed(1)+'s'}</p>`;$('timeline').innerHTML=project.scenes.map((s,i)=>`<button style="flex:${s.out-s.in}" class="${['hook','cta'].includes(s.reason)?'accent ':''}${i===shotIndex?'active':''}" onclick="selectShot(${i})"><span class="playhead" style="width:0"></span>${i+1}</button>`).join('');$('shots').innerHTML=project.scenes.map((s,i)=>`<div class="shot-row ${i===shotIndex?'active':''} ${i===invalidShot?'invalid':''}" role="button" tabindex="0" onclick="selectShot(${i})" onkeydown="if(event.key==='Enter')selectShot(${i})"><strong>${String(i+1).padStart(2,'0')}</strong><img src="${frameURL(s)}" alt="shot ${i+1}"><div><div class="shot-title">${s.locked?'🔒 ':''}${esc(s.subtitles?.[0]?.text||s.reason||'shot '+(i+1))}</div><div class="muted">${esc(s.source)} · ${Number(s.in).toFixed(1)}→${Number(s.out).toFixed(1)}</div><b>${(s.out-s.in).toFixed(1)}s</b></div></div>`).join('')||'<p class="muted">ยังไม่มี shots กด ↻ ตัดใหม่</p>';updateFooter()}
function renderShotEditor(){const s=project.scenes[shotIndex];$('shot-editor').innerHTML=(s?`<h3>SHOT ${String(shotIndex+1).padStart(2,'0')} / ${String(project.scenes.length).padStart(2,'0')} · ${esc(s.reason||'')}</h3><label class="wizard-label">Source</label><select id="shot-source" class="wizard-input">${project.sources.map(x=>`<option value="${esc(x.id)}" ${x.id===s.source?'selected':''}>${esc(x.id+' · '+x.original_name)}</option>`).join('')}</select><div class="row"><label class="wizard-label">in<input class="wizard-input" id="shot-in" type="number" min="0" step="0.1" value="${s.in}"></label><label class="wizard-label">ยาว<input class="wizard-input" id="shot-length" type="number" min="0.05" step="0.1" value="${Number((s.out-s.in).toFixed(3))}"></label></div><button class="btn" onclick="setFromPlayer()">⇤ ตั้งจาก player</button><label class="wizard-label">Subtitle</label><input id="shot-subtitle" class="wizard-input" value="${esc(s.subtitles?.[0]?.text||'')}"><p><label><input type="checkbox" id="shot-lock" ${s.locked?'checked':''}> 🔒 Lock</label></p><div class="row"><button class="btn" onclick="moveShot(-1)" ${shotIndex===0?'disabled':''}>↑</button><button class="btn" onclick="moveShot(1)" ${shotIndex===project.scenes.length-1?'disabled':''}>↓</button><button class="btn" onclick="removeShot()">ลบ shot</button></div>`:'<p class="muted">เลือก pattern แล้วกดตัดใหม่</p>')+`<div class="brand-box"><h3>LOGO BRAND</h3><div class="row">${project.logo?`<img class="logo-mini" src="${projectPath()}/logo?rev=${project.rev}" alt="logo">`:''}<label class="btn">อัปโหลด logo<input hidden type="file" id="logo-file" accept=".png,.jpg,.webp,.svg"></label></div><p class="muted">.png / .svg พื้นใส · ใช้ของ brand ไหนก็ได้</p>${project.logo?`<div class="corner-picker">${[['tl','↖'],['tr','↗'],['bl','↙'],['br','↘']].map(([p,a])=>`<button class="btn ${project.logo.position===p?'primary':''}" onclick="setLogoPosition('${p}')" aria-label="${p}">${a}</button>`).join('')}</div><label>ขนาด <span id="logo-size-value">${project.logo.size_pct}</span>%<input style="width:100%" id="logo-size" type="range" min="8" max="24" value="${project.logo.size_pct}"></label><button class="btn" onclick="deleteLogo()">ลบ logo</button>`:''}</div>`;if(s){$('shot-source').onchange=e=>editShot('source',e.target.value);$('shot-in').oninput=e=>editShot('in',Number(e.target.value));$('shot-length').oninput=e=>editShot('length',Number(e.target.value));$('shot-subtitle').oninput=e=>editShot('subtitle',e.target.value);$('shot-lock').onchange=e=>editShot('locked',e.target.checked)}$('logo-file').onchange=e=>uploadLogo(e.target.files[0]);if($('logo-size'))$('logo-size').oninput=e=>{project.logo.size_pct=Number(e.target.value);$('logo-size-value').textContent=e.target.value;markDirty();updateOverlays()}}
function editShot(key,value){stopPlayback();const s=project.scenes[shotIndex];if(!s)return;const length=s.out-s.in;if(key==='source'){s.source=value;const duration=project.sources.find(x=>x.id===value).duration;s.in=Math.min(s.in,Math.max(0,duration-.05));s.out=Math.min(duration,s.in+length);$('shot-in').value=s.in;$('shot-length').value=s.out-s.in}else if(key==='in'){s.in=value;s.out=Number((value+length).toFixed(3))}else if(key==='length')s.out=Number((s.in+value).toFixed(3));else if(key==='locked')s.locked=value;s.subtitles=[{start:0,end:Number((s.out-s.in).toFixed(3)),text:key==='subtitle'?value:s.subtitles?.[0]?.text||'',origin:'manual'}];markDirty();updateOverlays();clearTimeout(frameTimer);frameTimer=setTimeout(()=>{renderShotList();if(key==='in'||key==='source')seekSelected()},300)}
function setFromPlayer(){const v=activeVideo();if(!v||!Number.isFinite(v.currentTime))return;editShot('in',Number(v.currentTime.toFixed(3)));$('shot-in').value=project.scenes[shotIndex].in}
function moveShot(delta){stopPlayback();const next=shotIndex+delta;if(next<0||next>=project.scenes.length)return;[project.scenes[shotIndex],project.scenes[next]]=[project.scenes[next],project.scenes[shotIndex]];shotIndex=next;markDirty();renderShotList();renderShotEditor();seekSelected()}
function removeShot(){stopPlayback();project.scenes.splice(shotIndex,1);shotIndex=Math.min(shotIndex,Math.max(0,project.scenes.length-1));markDirty();renderShotList();renderShotEditor();updateOverlays();seekSelected()}
async function uploadLogo(file){if(!file||busy||saving)return;busy=true;const f=new FormData();f.append('file',file);try{const d=await api(projectPath()+'/logo',{method:'POST',body:f});const style=project.logo?{position:project.logo.position,size_pct:project.logo.size_pct}:{};project.logo={...d.logo,...style};project.rev=d.rev;saveDraft();renderProjectHeader();renderShotEditor();updateOverlays()}catch(e){toast(e.message,true)}finally{busy=false;updateFooter()}}
async function deleteLogo(){if(busy||saving||!confirm('ย้าย logo ไปถังขยะ?'))return;busy=true;try{const d=await api(projectPath()+'/logo',{method:'DELETE'});project.logo=d.logo;project.rev=d.rev;saveDraft();renderProjectHeader();renderShotEditor();updateOverlays()}catch(e){toast(e.message,true)}finally{busy=false;updateFooter()}}
function setLogoPosition(p){project.logo.position=p;markDirty();renderShotEditor();updateOverlays()}
function updateOverlays(){if(!$('cut-logo'))return;const logo=$('cut-logo'),l=project.logo;logo.style.display=l?'block':'none';if(l){logo.src=projectPath()+'/logo?rev='+project.rev;logo.style.width=l.size_pct+'%';logo.style.top=l.position[0]==='t'?'12.5%':'auto';logo.style.bottom=l.position[0]==='b'?'18%':'auto';logo.style.left=l.position[1]==='l'?'4.5%':'auto';logo.style.right=l.position[1]==='r'?'18%':'auto'}const s=project.scenes[shotIndex],sub=$('cut-subtitle');sub.textContent=s?.subtitles?.[0]?.text||'';sub.style.display=sub.textContent?'block':'none'}
let playbackRun=0,playing=false,activeSlot=0,animationId=null,videoFrameId=null,readyNext=null;
function activeVideo(){return $(activeSlot?'cut-b':'cut-a')}
function stopPlayback(){clearTimeout(frameTimer);playbackRun++;playing=false;cancelAnimationFrame(animationId);const v=activeVideo();if(v&&videoFrameId!=null&&v.cancelVideoFrameCallback)v.cancelVideoFrameCallback(videoFrameId);['cut-a','cut-b'].forEach(id=>$(id)?.pause());readyNext=null;if($('playback-state'))$('playback-state').textContent=''}
function mediaEvent(video,name,run,action){return new Promise((resolve,reject)=>{let timer;const clean=()=>{clearTimeout(timer);video.removeEventListener(name,done);video.removeEventListener('error',fail)},done=()=>{clean();run===playbackRun?resolve():reject(Error('cancelled'))},fail=()=>{clean();reject(Error('เล่น source นี้ไม่ได้ใน browser'))};video.addEventListener(name,done,{once:true});video.addEventListener('error',fail,{once:true});timer=setTimeout(()=>{clean();reject(Error('โหลดวิดีโอนานเกินไป กรุณาลองอีกครั้ง'))},20000);try{action()}catch(e){clean();reject(e)}})}
async function prepareVideo(video,index,run){const s=project.scenes[index];if(!s||!video)throw Error('ไม่มี shot');const url=sourceURL(s.source);video.pause();if(video.dataset.source!==url){video.dataset.source=url;await mediaEvent(video,'loadedmetadata',run,()=>{video.src=url;video.load()})}else if(video.readyState===0){await mediaEvent(video,'loadedmetadata',run,()=>{})}if(run!==playbackRun)throw Error('cancelled');if(Math.abs(video.currentTime-s.in)>.001||video.readyState<2)await mediaEvent(video,'seeked',run,()=>{video.currentTime=s.in});if(video.readyState<2)await mediaEvent(video,'loadeddata',run,()=>{});if(run!==playbackRun)throw Error('cancelled');return video}
async function seekSelected(){if(!project.scenes[shotIndex]||!$('cut-a'))return;const run=playbackRun;activeSlot=0;$('cut-a').style.visibility='visible';$('cut-b').style.visibility='hidden';try{await prepareVideo($('cut-a'),shotIndex,run);displayTime()}catch(e){if(run===playbackRun)toast(e.message,true)}}
function selectShot(i){stopPlayback();shotIndex=i;renderShotList();renderShotEditor();updateOverlays();seekSelected()}
function displayTime(){const s=project.scenes[shotIndex],v=activeVideo();if(!s||!v||!$('cut-timecode'))return;const elapsed=Math.max(0,Math.min(s.out-s.in,v.currentTime-s.in));$('cut-timecode').textContent=`shot ${shotIndex+1} · ${elapsed.toFixed(1)} / ${(s.out-s.in).toFixed(1)}s`;const bars=$('timeline').children;for(let i=0;i<bars.length;i++)bars[i].querySelector('.playhead').style.width=(i<shotIndex?100:i===shotIndex?Math.min(100,elapsed/(s.out-s.in)*100):0)+'%'}
async function playShots(all){stopPlayback();if(!project.scenes.length)return;const run=playbackRun;playing=true;activeSlot=0;if(all)shotIndex=0;const show=()=>{renderShotList();renderShotEditor();updateOverlays();const rows=$('shots').children;rows[shotIndex]?.scrollIntoView({block:'nearest'});$('cut-a').style.visibility=activeSlot===0?'visible':'hidden';$('cut-b').style.visibility=activeSlot===1?'visible':'hidden'};let advancing=false;
 const preload=()=>{if(all&&shotIndex+1<project.scenes.length){const other=$(activeSlot?'cut-a':'cut-b');readyNext=prepareVideo(other,shotIndex+1,run).then(v=>({video:v}),error=>({error}))}else readyNext=null};
 const tick=()=>{if(!playing||run!==playbackRun||advancing)return;displayTime();const v=activeVideo(),s=project.scenes[shotIndex];if(v.currentTime>=s.out-.008||v.ended){advance();return}if(v.requestVideoFrameCallback)videoFrameId=v.requestVideoFrameCallback(tick);else animationId=requestAnimationFrame(tick)};
 const advance=async()=>{if(advancing||run!==playbackRun)return;advancing=true;activeVideo().pause();if(!all||shotIndex+1>=project.scenes.length){playing=false;displayTime();return}try{const result=await readyNext;if(run!==playbackRun)return;if(result?.error)throw result.error;activeSlot=1-activeSlot;shotIndex++;show();const flash=$('cut-flash');flash.animate([{opacity:.25},{opacity:0}],{duration:120});await activeVideo().play();if(run!==playbackRun)return;preload();advancing=false;tick()}catch(e){if(run===playbackRun){stopPlayback();toast(e.message,true)}}};
 try{show();$('playback-state').textContent='กำลังเตรียมวิดีโอ…';await prepareVideo(activeVideo(),shotIndex,run);preload();if(readyNext){const next=await readyNext;if(next.error)throw next.error}if(run!==playbackRun)return;await activeVideo().play();$('playback-state').textContent='';['cut-a','cut-b'].forEach(id=>{$(id).ontimeupdate=()=>{if(playing&&!activeVideo().requestVideoFrameCallback&&!advancing)displayTime()};$(id).onended=()=>{if(playing&&$(id)===activeVideo())advance()}});tick()}catch(e){if(run===playbackRun){stopPlayback();toast(e.message,true)}}}
async function saveProject(){if(saving)return saving;if(busy){toast('รอการอัปโหลดหรือตัดใหม่เสร็จก่อน',true);return false}if(projectConflict){toast('โหลดใหม่หรือเลือกใช้ฉบับร่างก่อนบันทึก',true);return false}const snapshot=JSON.parse(JSON.stringify(project)),version=mutation,slug=projectSlug;saving=(async()=>{try{const d=await api('/api/projects/'+encodeURIComponent(slug),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)});if(projectSlug!==slug)return false;project.rev=d.project.rev;project.updated_at=d.project.updated_at;invalidShot=-1;if(version===mutation){project={goal_type:null,pattern:null,logo:null,step:1,...d.project};clearDirty()}else saveDraft();renderProjectHeader();if(wizardStep===5)renderExport();return true}catch(e){saveDraft();if(e.message==='project revision conflict'){projectConflict=true;$('draft-offer').innerHTML='<div class="notice">มีการแก้จากอีกเครื่อง ฉบับร่างถูกเก็บไว้ <button class="btn" onclick="reloadProject()">โหลดล่าสุดและเทียบฉบับร่าง</button></div>'}else{const hit=e.message.match(/scenes(?:\[|\.)(\d+)/);if(hit){invalidShot=Number(hit[1]);shotIndex=invalidShot;wizardStep=4;showProject()}}toast(e.message,true);return false}finally{saving=null}})();return saving}
async function reloadProject(){saveDraft();await openProject(projectSlug)}
async function renderExport(){const slug=projectSlug;$('wizard-body').innerHTML=`<div class="wizard-content"><h2>Export to agent</h2><div class="summary-grid"><div class="summary-tile">Sources<strong>${new Set(project.scenes.map(s=>s.source)).size}</strong></div><div class="summary-tile">Shots<strong>${project.scenes.length}</strong></div><div class="summary-tile">Total / target<strong>${seconds().toFixed(1)} / ${project.target_seconds}s</strong></div><div class="summary-tile">Logo<strong>${project.logo?'✓':'–'}</strong></div></div><p>ใน package: edit.json · sources ที่ใช้ · ${project.logo?'logo · ':''}keyframe ของทุก shot</p><p class="muted">JSON ด้านล่างมาจากโปรเจกต์ที่บันทึกแล้ว${projectDirty?' — มีการแก้ไขที่ยังไม่บันทึก':''}</p><pre id="export-json" class="export-json">กำลังโหลด…</pre><button id="export-button" class="btn primary" onclick="exportProject()">Export .zip</button><div id="export-result"></div><h3>Previous exports</h3><div id="export-list"></div></div>`;try{const [edit,list]=await Promise.all([api(projectPath()+'/edit.json'),api(projectPath()+'/exports')]);if(slug!==projectSlug||wizardStep!==5)return;$('export-json').textContent=JSON.stringify(edit,null,2);$('export-list').innerHTML=(list.exports||list).map(e=>`<div class="export-item"><a href="${projectPath()}/exports/${encodeURIComponent(e.name)}" download>${esc(e.name)}</a><span class="muted">${(e.size/1048576).toFixed(1)} MB</span></div>`).join('')||'<p class="muted">ยังไม่มี exports</p>'}catch(e){if($('export-json'))$('export-json').textContent=e.message;toast(e.message,true)}}
async function exportProject(){if(busy||saving)return;if(projectDirty&&!await saveProject())return;if(projectDirty)return toast('มีการแก้ไขระหว่างบันทึก กด Export อีกครั้ง',true);busy=true;const button=$('export-button');button.disabled=true;button.textContent='กำลังสร้าง .zip…';try{const d=await api(projectPath()+'/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:project.rev})});await renderExport();$('export-result').innerHTML=`<p><a id="latest-export" href="${projectPath()}/exports/${encodeURIComponent(d.name)}" download>ดาวน์โหลด ${esc(d.name)} (${(d.size/1048576).toFixed(1)} MB)</a></p>`;$('latest-export').click()}catch(e){toast(e.message,true)}finally{busy=false;if($('export-button')){$('export-button').disabled=false;$('export-button').textContent='Export .zip'}}}
window.addEventListener('beforeunload',e=>{if(projectDirty){saveDraft();e.preventDefault();e.returnValue=''}});

loadConfig();loadProjects();
</script></body></html>
