<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodStock Reels / Edit desk</title>
<style>
@font-face{font-family:Kanit;src:url('/fonts/Kanit-SemiBold.ttf')}@font-face{font-family:Kanit;src:url('/fonts/Kanit-Bold.ttf');font-weight:700}@font-face{font-family:Noto;src:url('/fonts/NotoSansThai.ttf')}*{box-sizing:border-box}body{margin:0;background:#20282f;color:#f5efe6;font:14px Noto,system-ui,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#495862;border-bottom:2px solid #e0a43b;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font:700 22px Kanit}.brand em{color:#e0a43b;font-style:normal}.eyebrow{font:11px Kanit;letter-spacing:2px;color:#c7cdd2;margin-left:14px}.top-actions{display:flex;gap:10px;align-items:center}.token{width:180px;background:#2a333b;border:1px solid #6d7c85;border-radius:4px;padding:7px 9px;color:#f5efe6;font-size:11px}.btn{border:1px solid #687780;background:#2a333b;color:#f5efe6;border-radius:4px;padding:9px 13px;font:600 13px Kanit}.btn:hover{border-color:#e0a43b}.btn.primary{background:#e0a43b;border-color:#e0a43b;color:#2a333b}.btn:disabled{opacity:.4;cursor:not-allowed}.shell{display:grid;grid-template-columns:275px 1fr;min-height:calc(100vh - 64px);height:calc(100vh - 64px)}aside{background:#171f26;border-right:1px solid #35434c;display:flex;flex-direction:column}.side-head{padding:18px 16px 12px;display:flex;justify-content:space-between;align-items:end}.side-head h2{margin:0;font:700 20px Kanit}.count{font:11px Kanit;color:#8d9aa1}.clip-list{overflow:auto;flex:1;padding:0 10px}.clip{padding:13px 10px;border:1px solid transparent;border-bottom-color:#2a343b;display:flex;gap:10px;align-items:start;cursor:pointer}.clip:hover{background:#222d35}.clip.active{border-color:#e0a43b;background:#2a333b;border-radius:4px}.clip-dot{width:8px;height:8px;border-radius:50%;background:#67757d;margin-top:6px;flex:0 0 auto}.clip-dot.TRANSCRIBED{background:#e0a43b}.clip-dot.REVIEWED{background:#61a9d5}.clip-dot.RENDERED{background:#69bc84}.clip-name{font:600 14px Kanit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clip-status{font:10px Kanit;letter-spacing:1px;color:#9ba7ad;margin-top:3px}.clip-status.TRANSCRIBED{color:#e0a43b}.clip-status.REVIEWED{color:#79c5ed}.clip-status.RENDERED{color:#78d38f}.add{margin:12px;background:#2a333b;border:1px dashed #6d7c85;color:#e0a43b;padding:12px;border-radius:4px;font:600 13px Kanit}.main{display:grid;grid-template-columns:minmax(460px,1fr) 460px;min-width:0}.preview{background:#12191e;display:flex;align-items:center;justify-content:center;padding:30px;position:relative}.preview video{height:min(76vh,760px);max-width:100%;aspect-ratio:9/16;background:#0c1114;box-shadow:0 16px 50px #0009;border:1px solid #53616a}.preview-note{position:absolute;left:24px;top:20px;color:#677780;font:11px Kanit;letter-spacing:1px}.panel{background:#2a333b;border-left:1px solid #3b4850;padding:24px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #46545c;padding-bottom:16px;margin-bottom:18px}.panel h1{font:700 25px Kanit;margin:0}.muted{color:#9eabb0;font-size:11px}.badge{font:11px Kanit;letter-spacing:1px;padding:5px 8px;border-radius:3px;background:#4d5960;color:#d8e0e2}.badge.TRANSCRIBED{background:#604d29;color:#ffd477}.badge.REVIEWED{background:#214d66;color:#a8ddff}.badge.RENDERED{background:#23533a;color:#adf2c2}.section{margin:22px 0}.section-title{font:11px Kanit;letter-spacing:2px;color:#c7cdd2;text-transform:uppercase;margin-bottom:10px}.cue{display:grid;grid-template-columns:57px 57px 1fr 28px;gap:6px;margin:8px 0;align-items:start}.cue input,.cue textarea,.restaurant{background:#20282f;border:1px solid #45535b;border-radius:3px;color:#f5efe6;padding:7px;font-size:12px}.cue textarea{min-height:54px;resize:vertical;line-height:1.5}.cue input:focus,.cue textarea:focus,.restaurant:focus{outline:none;border-color:#e0a43b}.cue button{background:transparent;border:1px solid #633b3b;color:#e9857c;border-radius:3px;height:28px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-left:3px solid #e0a43b;background:#222d35;color:#c7cdd2;font-size:12px;line-height:1.6}.notice strong{color:#f5efe6}.jobs{font:11px ui-monospace,monospace;color:#a8b4b9;background:#171f26;padding:10px;border-radius:4px;white-space:pre-wrap;max-height:110px;overflow:auto}.empty{margin:auto;text-align:center;color:#7d8a91}.upload{position:fixed;inset:0;background:#10161acc;display:none;align-items:center;justify-content:center}.dialog{width:390px;background:#2a333b;border:1px solid #65747d;border-top:3px solid #e0a43b;border-radius:5px;padding:24px;box-shadow:0 20px 60px #000b}.dialog h2{font:700 22px Kanit;margin:0 0 18px}.dialog label{display:block;color:#c7cdd2;font:11px Kanit;letter-spacing:1px;margin:12px 0 5px}.dialog input[type=text],.dialog input[type=file]{width:100%;padding:9px;background:#20282f;border:1px solid #45535b;color:#f5efe6;border-radius:3px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:900px){.main{grid-template-columns:1fr}.panel{display:none}.shell{grid-template-columns:230px 1fr}}
.preview-frame{height:min(76vh,760px);max-width:100%;aspect-ratio:9/16;position:relative;background:#0c1114;box-shadow:0 16px 50px #0009;border:1px solid #53616a;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover}.preview-logo{position:absolute;top:12.5%;left:4.45%;width:13.9%;filter:drop-shadow(0 3px 8px #0008);pointer-events:none}.preview-subtitle{position:absolute;left:16.7%;right:16.7%;bottom:18.75%;padding:8px 12px;border-radius:9px;background:#2a333bcc;color:#f5efe6;text-align:center;font:600 clamp(12px,3vw,25px)/1.25 Noto,sans-serif;text-wrap:balance;display:none;pointer-events:none}.safe-guide{position:absolute;inset:11.5% 16.7% 16.7% 0;border:1px dashed #e0a43b99;pointer-events:none;display:none}.safe-guide.on{display:block}</style></head><body>
<header class="top"><div><span class="brand">Food<em>Stock</em></span><span class="eyebrow">REELS / EDIT DESK</span></div><div class="top-actions"><input class="token" id="token" placeholder="editor token (optional)" type="password"><button class="btn" onclick="loadClips()">Refresh</button><button class="btn" onclick="openImport()">＋ Import จาก Drive link</button><button class="btn primary" onclick="openUpload()">+ เพิ่มคลิป</button></div></header>
<div class="shell"><aside><div class="side-head"><h2>Clip queue</h2><span class="count" id="count">—</span></div><div class="clip-list" id="clip-list"></div><button class="add" onclick="openUpload()">+ เพิ่ม source video</button></aside><main class="main"><section class="preview"><span class="preview-note">SOURCE PREVIEW · 9:16</span><div class="preview-frame"><video id="source" controls playsinline></video><img class="preview-logo" src="/brand/logo-cream.png"><div class="preview-subtitle" id="preview-subtitle"></div><div class="safe-guide" id="safe-guide"></div></div><div class="empty" id="empty">เลือกคลิปจาก queue<br><small>preview โดยประมาณ — ผลจริงดูหลัง render</small></div></section><section class="panel" id="panel"><div class="empty">เลือกคลิปเพื่อเริ่มงาน</div></section></main></div>
<div class="upload" id="upload"><form class="dialog" onsubmit="upload(event)"><h2>เพิ่มคลิปใหม่</h2><label>ชื่อร้าน</label><input id="restaurant" type="text" required placeholder="เช่น ครัวบ้านสวน"><label>ชื่อโฟลเดอร์ (optional)</label><input id="clip-name" type="text" placeholder="sample-foodstock"><label>source.mp4</label><input id="file" type="file" accept="video/mp4" required><div class="dialog-actions"><button type="button" class="btn" onclick="closeUpload()">ยกเลิก</button><button class="btn primary">อัปโหลดเข้า Drive</button></div></form></div>
<div class="upload" id="importer"><form class="dialog" onsubmit="scanImport(event)"><h2>Import จาก Drive link</h2><label>Google Drive folder link</label><input id="drive-url" type="text" required placeholder="https://drive.google.com/drive/folders/…"><div id="import-files"></div><label>ชื่อร้าน</label><input id="import-restaurant" type="text" required placeholder="เช่น ครัวบ้านสวน"><label>ชื่อโฟลเดอร์ (optional)</label><input id="import-name" type="text" placeholder="ตั้งจากชื่อร้านอัตโนมัติ"><div class="dialog-actions"><button type="button" class="btn" onclick="closeImport()">ยกเลิก</button><button class="btn primary" id="scan-button">สแกนไฟล์</button></div></form></div>
<script>
let clips=[], selected=null, transcript=null, poll=null;
const $=id=>document.getElementById(id); const auth=()=>{const t=$('token').value.trim();localStorage.setItem('reels-token',t);return t?{'X-Editor-Token':t}:{} }; $('token').value=localStorage.getItem('reels-token')||'';
async function api(path,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(path,opt);const data=await r.json().catch(()=>({}));if(r.status===401)throw Error('ต้องกรอก editor token ในช่องด้านบนก่อน');if(!r.ok)throw Error(data.error||r.statusText);return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadClips(){try{const d=await api('/api/clips');clips=d.clips;$('count').textContent=clips.length+' clips';renderList();if(selected){const keep=clips.find(x=>x.name===selected.name);if(keep)select(keep);}}catch(e){toast(e.message,true)}}
function renderList(){$('clip-list').innerHTML=clips.map(c=>`<div class="clip ${selected&&selected.name===c.name?'active':''}" onclick="selectByName('${esc(c.name)}')"><i class="clip-dot ${c.status}"></i><div><div class="clip-name">${esc(c.restaurant)}</div><div class="clip-status ${c.status}">${c.status==='TRANSCRIBED'?'รอ review':c.status}</div></div></div>`).join('')||'<div class="empty" style="padding:28px 10px">ยังไม่มีคลิป</div>'}
function selectByName(n){select(clips.find(c=>c.name===n))}; async function select(c){if(!c)return;selected=c;renderList();$('empty').style.display='none';$('source').style.display='block';$('source').src='/api/clips/'+encodeURIComponent(c.name)+'/source';renderPanel();if(c.files.includes('transcript.json')){try{transcript=await api('/api/clips/'+encodeURIComponent(c.name)+'/transcript');renderPanel()}catch(e){}}}
function renderPanel(){if(!selected)return;const c=selected;let cues=(transcript?.segments||transcript?.words||[]);$('panel').innerHTML=`<div class="panel-head"><div><h1>${esc(c.restaurant)}</h1><div class="muted">${esc(c.name)} · ${c.files.join(' · ')}</div></div><span class="badge ${c.status}">${c.status}</span></div>${c.status==='NEW'?'<div class="notice"><strong>ยังไม่มี transcript</strong><br>กดถอดเสียงเพื่อเริ่ม review</div>':''}${c.status==='TRANSCRIBED'?'<div class="notice"><strong>Review gate</strong><br>แก้ข้อความและเวลาให้ถูกต้อง แล้วกด “✓ Review เสร็จ” ก่อน render</div>':''}<div class="section"><div class="section-title">Transcript cues</div><div id="cues">${cues.length?cues.map((x,i)=>`<div class="cue"><input data-i="${i}" data-k="start" value="${x.start??0}"><input data-i="${i}" data-k="end" value="${x.end??0}"><textarea data-i="${i}" data-k="text">${esc(x.text||x.word||'')}</textarea><button onclick="removeCue(${i})">×</button></div>`).join(''):'<div class="muted">ยังไม่มี transcript</div>'}</div><div class="row"><button class="btn" onclick="addCue()">+ เพิ่ม cue</button><button class="btn" onclick="saveTranscript()" ${cues.length?'':'disabled'}>บันทึก transcript</button></div></div><div class="section"><div class="section-title">Next action</div><div class="row">${c.status==='NEW'?'<button class="btn primary" onclick="transcribe()">ถอดเสียง</button>':''}${c.status==='TRANSCRIBED'?'<button class="btn primary" onclick="review()">✓ Review เสร็จ</button>':''}${c.status==='REVIEWED'?'<button class="btn primary" onclick="renderClip()">Render reel</button>':''}${c.status==='RENDERED'?'<button class="btn primary" onclick="showOutput()">ดู reel</button>':''}</div></div><div id="job"></div>`}
function cueData(){return (transcript?.segments||transcript?.words||[])}function addCue(){const a=cueData();a.push({start:a.length?(+a[a.length-1].end+.1).toFixed(2):0,end:a.length?(+a[a.length-1].end+2).toFixed(2):2,text:''});renderPanel()}function removeCue(i){cueData().splice(i,1);renderPanel()}
function readCues(){document.querySelectorAll('.cue [data-i]').forEach(el=>{const x=cueData()[+el.dataset.i];x[el.dataset.k]=el.dataset.k==='text'?el.value:Number(el.value)})}
async function saveTranscript(){readCues();try{await api('/api/clips/'+selected.name+'/transcript',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(transcript)});toast('บันทึก transcript แล้ว');await loadClips()}catch(e){toast(e.message,true)}}
async function transcribe(){try{const d=await api('/api/clips/'+selected.name+'/transcribe',{method:'POST'});watch(d.job_id)}catch(e){toast(e.message,true)}}async function review(){await saveTranscript();try{await api('/api/clips/'+selected.name+'/review',{method:'POST'});toast('Review gate เปิดแล้ว');await loadClips()}catch(e){toast(e.message,true)}}async function renderClip(){try{const d=await api('/api/clips/'+selected.name+'/render',{method:'POST'});watch(d.job_id)}catch(e){toast(e.message,true)}}
function watch(id){$('panel').insertAdjacentHTML('beforeend','<div class="section" id="watch"><div class="section-title">Job progress</div><div class="jobs" id="joblog">เริ่มงาน…</div></div>');clearInterval(poll);poll=setInterval(async()=>{try{const j=await api('/api/status/'+id);$('joblog').textContent=`${j.status} ${j.progress}%\n`+(j.log||[]).join('\n');if(j.status==='done'||j.status==='error'){clearInterval(poll);await loadClips()}}catch(e){clearInterval(poll)}},700)}async function showOutput(){window.open('/api/clips/'+selected.name+'/output','_blank')}
function openUpload(){$('upload').style.display='flex'}function closeUpload(){$('upload').style.display='none'}
function openImport(){$('importer').style.display='flex'}function closeImport(){$('importer').style.display='none';$('import-files').innerHTML=''}
async function scanImport(e){e.preventDefault();const button=$('scan-button');const url=$('drive-url').value;try{if(!button.dataset.scanned){button.disabled=true;button.textContent='กำลังสแกน…';const d=await api('/api/import/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!d.files.length)throw Error('ไม่พบไฟล์ .mp4/.mov ใน folder นี้');$('import-files').innerHTML='<label>เลือกไฟล์</label>'+d.files.map((f,i)=>`<label style="display:block"><input type="radio" name="import-file" value="${esc(f.name)}" ${i?'':'checked'}> ${esc(f.name)} <span class="muted">${esc(f.size)}</span></label>`).join('');button.dataset.scanned='1';button.textContent='Import เข้า FoodStock';return}const file=document.querySelector('input[name="import-file"]:checked')?.value;if(!file)throw Error('เลือกไฟล์ก่อน');button.textContent='กำลัง import…';const d=await api('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,file,restaurant:$('import-restaurant').value,name:$('import-name').value})});closeImport();e.target.reset();button.dataset.scanned='';button.textContent='สแกนไฟล์';toast('Import เข้า Drive แล้ว');await loadClips();select(d.clip)}catch(x){toast(x.message,true)}finally{button.disabled=false}}
async function upload(e){e.preventDefault();const f=new FormData();f.append('restaurant',$('restaurant').value);f.append('name',$('clip-name').value);f.append('file',$('file').files[0]);try{await api('/api/clips',{method:'POST',body:f});closeUpload();e.target.reset();toast('อัปโหลดเข้า Drive แล้ว');loadClips()}catch(x){toast(x.message,true)}}function toast(msg,error=false){const el=document.createElement('div');el.textContent=msg;el.style='position:fixed;right:22px;bottom:22px;background:'+(error?'#7b3f3d':'#315a46')+';color:#f5efe6;padding:12px 16px;border-radius:4px;z-index:9;font:13px Noto';document.body.append(el);setTimeout(()=>el.remove(),3500)}
function updatePreview(){const now=$('source').currentTime;const cues=cueData();const cue=cues.find(x=>now>=Number(x.start||0)&&now<=Number(x.end||0));const el=$('preview-subtitle');el.textContent=cue?(cue.text||cue.word||''):'';el.style.display=cue?'block':'none'}
function toggleGuides(){$('safe-guide').classList.toggle('on')}
 $('source').addEventListener('loadedmetadata',()=>{if(selected&&!selected.source_duration){selected.source_duration=$('source').duration;renderPanel()}});$('source').addEventListener('timeupdate',updatePreview);$('source').addEventListener('ended',()=>{if(selected?.trim_start!=null){$('source').currentTime=Number(selected.trim_start);$('source').play().catch(()=>{})}});$('panel').addEventListener('input',()=>{readCues();updatePreview()});document.querySelector('.preview-note').addEventListener('click',toggleGuides);document.querySelector('.preview-note').style.cursor='pointer';
function renderTrim(){const c=selected;if(!c)return;const duration=Number(c.source_duration||$('source').duration||0);const start=Number(c.trim_start||0);const end=Number(c.trim_end||duration);const box=document.createElement('div');box.className='section';box.innerHTML=`<div class="section-title">Trim · max 30s</div><div class="notice">ช่วงที่เลือก: <strong>${start.toFixed(1)}s → ${end.toFixed(1)}s</strong> · ${(end-start).toFixed(1)}s</div><div class="row" style="margin-top:8px"><button class="btn" onclick="setTrimIn()">จุดเริ่ม</button><button class="btn" onclick="setTrimOut()">จุดจบ</button><button class="btn primary" onclick="saveSettings()">บันทึกช่วง</button></div><div class="muted" style="margin-top:6px">source ${duration.toFixed(1)}s · กดจุดเริ่ม/จุดจบจากตำแหน่ง player ปัจจุบัน</div>`;$('panel').prepend(box)}
function setTrimIn(){selected.trim_start=Math.max(0,Number($('source').currentTime.toFixed(3)));if(selected.trim_end==null||selected.trim_end<=selected.trim_start)selected.trim_end=Math.min(Number($('source').duration||30),selected.trim_start+30);renderPanel()}
function setTrimOut(){selected.trim_end=Number($('source').currentTime.toFixed(3));renderPanel()}
async function saveSettings(){const start=Number(selected.trim_start||0),end=Number(selected.trim_end||$('source').duration||0);if(end<=start||end-start>30){toast('ช่วงต้องมากกว่า 0 และไม่เกิน 30 วินาที',true);return}try{await api('/api/clips/'+selected.name+'/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({trim_start:start,trim_end:end,source_duration:Number(selected.source_duration||$('source').duration)})});toast('บันทึก trim แล้ว');await loadClips()}catch(e){toast(e.message,true)}}
const baseRenderPanel=renderPanel; renderPanel=function(){baseRenderPanel();renderTrim();if(selected?.status==='READY'){const n=document.createElement('div');n.className='notice';n.innerHTML='<strong>READY — รอ render (Mac)</strong><br>review แล้ว คลิปจะเข้า queue ให้ run_batch.sh บน Mac';$('panel').prepend(n)}}
loadClips();
</script></body></html>
